name: Generate compendium sitemap

# Hält compendium/sitemap.xml automatisch synchron mit den TATSÄCHLICH deployten
# Artikel-Verzeichnissen (compendium/*/index.html) — immun gegen Pipeline-Clobber, der
# zuvor die corpus-only-Slugs (invisible-shortlist, lead-scoring, mql, sql, touchpoints)
# aus der Sitemap fallen ließ. Scannt das echte Live-Korpus, nicht eine Pipeline-Ausgabe.

on:
  push:
    branches: [main]
    paths:
      - 'compendium/**/index.html'   # Sitemap-only-Push triggert NICHT → keine Schleife
  workflow_dispatch:                  # manuell auslösbar

permissions:
  contents: write

# root-sitemap.yml laeuft auf Compendium-Pushes mit → nacheinander statt gleichzeitig pushen
concurrency:
  group: sitemap-write
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # volle Historie für <lastmod> = git-Commit-Datum je Datei
      - name: Build sitemap from live corpus
        run: |
          cd compendium
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            echo '  <url><loc>https://insights.rhinegold.de/compendium/</loc></url>'
            for d in */; do
              [ -f "${d}index.html" ] || continue
              echo "  <url><loc>https://insights.rhinegold.de/compendium/${d}</loc><lastmod>$(git log -1 --format=%cs -- "${d}index.html")</lastmod></url>"
            done
            echo '</urlset>'
          } > sitemap.xml
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compendium/sitemap.xml
          # Kein [skip ci]: der paths-Filter (compendium/**/index.html) verhindert die Schleife,
          # und der sitemap-Commit soll den Pages-Deploy auslösen.
          # Rebase: root-sitemap.yml kann denselben Push schon bedient haben (andere Dateien → konfliktfrei)
          git diff --staged --quiet || { git commit -m "chore: regenerate compendium sitemap"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }

      - name: IndexNow ping (geaenderte Compendium-Artikel)
        continue-on-error: true       # Ping-Fehler darf den Workflow nicht failen
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          INDEXNOW_KEY: 45d7267bd5c6cf3df6b71cf52e89a7bf   # oeffentlich by design, liegt als <key>.txt im Root
        run: |
          # Kein Vorgaenger (workflow_dispatch, erster Push, Force-Push) → kein Diff, kein Ping
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) echo "Kein Vorgaenger-Commit → kein Ping"; exit 0 ;; esac
          URLS=$(git diff --name-only --diff-filter=AMR "$BEFORE" "$SHA" -- 'compendium/*/index.html' \
            | while read -r f; do echo "https://insights.rhinegold.de/compendium/$(basename "$(dirname "$f")")/"; done)
          [ -n "$URLS" ] || { echo "Keine geaenderten Artikel → kein Ping"; exit 0; }
          echo "$URLS"
          BODY=$(printf '%s\n' "$URLS" | jq -R . | jq -s --arg key "$INDEXNOW_KEY" \
            '{host: "insights.rhinegold.de", key: $key, keyLocation: ("https://insights.rhinegold.de/" + $key + ".txt"), urlList: .}')
          STATUS=$(curl -s -o indexnow_response.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY") || true
          echo "IndexNow HTTP ${STATUS}"; cat indexnow_response.txt 2>/dev/null || true
