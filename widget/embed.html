<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1612;--paper:#f7f4ef;--gold:#c8892e;--mid:#6b6560;
  --rule:#e0d9cf;--warm:#efe9e0;
  --sans:'DM Sans',system-ui,sans-serif;
  --display:'Fraunces',Georgia,serif;
}
html,body{background:transparent;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
.rg-feed{width:100%;padding:0}
.rg-feed-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.rg-feed-title{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.rg-feed-all{font-size:12px;color:var(--mid);text-decoration:none;letter-spacing:.04em;transition:color .15s}
.rg-feed-all:hover{color:var(--gold)}
.rg-feed-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.rg-card{background:var(--paper);padding:22px 24px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;transition:background .15s;min-height:130px}
.rg-card:hover{background:#f0ece4}
.rg-card-type{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--mid)}
.rg-card-type.compendium{color:var(--gold)}
.rg-card-type.insights{color:#39607a}
.rg-card-title{font-family:var(--display);font-weight:400;font-size:1.08rem;line-height:1.25;color:var(--ink)}
.rg-card-teaser{font-size:.82rem;color:#55504a;font-weight:300;line-height:1.5;flex:1}
.rg-card-date{font-size:.72rem;color:var(--mid);margin-top:4px}
.rg-feed-empty{font-size:.9rem;color:var(--mid);padding:20px 0;font-style:italic}
.rg-feed-err{font-size:.8rem;color:#9a5a23;padding:8px 0}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="rg-feed" id="rgFeed">
  <div class="rg-feed-header">
    <span class="rg-feed-title">Neu bei rhinegold</span>
    <div style="display:flex;gap:16px;align-items:center">
      <a class="rg-feed-all" href="https://insights.rhinegold.de/compendium/" target="_blank">Alle Einträge →</a>
      <a class="rg-feed-all" href="https://insights.rhinegold.de/compendium/rss.xml" target="_blank" title="RSS Feed abonnieren" style="font-size:11px">&#x25A3; RSS</a>
    </div>
  </div>
  <div id="rgGrid" class="rg-feed-grid"></div>
</div>
<script>
(function(){
  var FEED = 'https://cdn.jsdelivr.net/gh/MHZach/mapgap@main/feed.json';
  var LIMIT = 6;

  function fmt(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString('de-DE',{day:'2-digit',month:'short',year:'numeric'});
    }catch(e){return iso;}
  }

  function typeLabel(t){
    if(t==='insights') return 'Insights';
    return 'Compendium';
  }

  function render(items){
    var grid = document.getElementById('rgGrid');
    if(!items || !items.length){
      grid.innerHTML = '<p class="rg-feed-empty">Keine Einträge verfügbar.</p>';
      return;
    }
    var html = '';
    var show = items.slice(0, LIMIT);
    for(var i=0;i<show.length;i++){
      var it = show[i];
      var tclass = (it.type||'compendium').toLowerCase() === 'insights' ? 'insights' : 'compendium';
      html += '<a class="rg-card" href="'+esc(it.url)+'" target="_blank">'
            + '<span class="rg-card-type '+tclass+'">'+typeLabel(it.type||'compendium')+'</span>'
            + '<span class="rg-card-title">'+esc(it.title)+'</span>'
            + '<span class="rg-card-teaser">'+esc(it.teaser||'')+'</span>'
            + '<span class="rg-card-date">'+fmt(it.date)+'</span>'
            + '</a>';
    }
    grid.innerHTML = html;
  }

  function esc(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  fetch(FEED)
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){render(d.items||[]);})
    .catch(function(e){
      document.getElementById('rgGrid').innerHTML = '<p class="rg-feed-err">Feed konnte nicht geladen werden.</p>';
    });
})();
</script>
</body>
</html>
